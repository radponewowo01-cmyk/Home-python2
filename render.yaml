services:
  - type: web
    name: tw-stock
    runtime: python
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m gunicorn --workers 1 --threads 8 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: STOCK_LIST_FILE
        value: /var/data/stock_list.json
    disk:
      name: stock-list-data
      mountPath: /var/data
      sizeGB: 1
